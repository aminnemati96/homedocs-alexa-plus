[project]
name = "homedocs-agent"
version = "0.1.0"
description = "Simulated Alexa+ backend: Bedrock Converse with tools from the homedocs MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    # crt is required for credentials from `aws login`
    "boto3[crt]>=1.43",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
homedocs-agent = "homedocs_agent.app:main"
homedocs-ask = "homedocs_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homedocs_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

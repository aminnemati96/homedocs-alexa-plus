[project]
name = "homedocs-mcp"
version = "0.1.0"
description = "MCP server that answers questions about household paperwork (bills, leases, warranties, insurance)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.30,<2",
    # crt is required for credentials from `aws login`
    "boto3[crt]>=1.43",
    "qdrant-client>=1.19,<2",
]

[project.scripts]
homedocs-mcp = "homedocs_mcp.server:main"
homedocs-ingest = "homedocs_mcp.ingest:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homedocs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
